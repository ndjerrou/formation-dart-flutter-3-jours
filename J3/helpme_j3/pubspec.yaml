name: helpme_j3
description: HelpMe, catalogue d'artisans et suivi des demandes.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  path_provider: ^2.1.5
  path: ^1.9.1
  json_annotation: ^4.12.0
  intl: any
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  json_serializable: ^6.11.1
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalogue.json
    - assets/atelier.png
